<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Doctor — 诊断并优化已有提示词</title>
  <desc id="desc">一个诊断台式流程：从模糊提示词的症状，经过缺口诊断，得到可复制、可核查的优化版本。</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121F30"/>
      <stop offset="1" stop-color="#0E1927"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#09131F"/>
  <path d="M0 350 H1200" stroke="#203247" stroke-width="2"/>
  <path d="M566 48 V326" stroke="#203247" stroke-width="2"/>

  <g id="title-block" transform="translate(58 52)">
    <g aria-label="Prompt quality skill">
      <rect width="230" height="34" rx="17" fill="#17392F"/>
      <circle cx="19" cy="17" r="6" fill="#43D3A3"/>
      <text x="34" y="23" fill="#AEEBD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">PROMPT QUALITY SKILL</text>
    </g>

    <text x="0" y="112" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="66" font-weight="760" letter-spacing="-2">Prompt Doctor</text>
    <text x="2" y="161" fill="#B5C1CF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26">诊断已有提示词，开出最小有效处方</text>

    <g transform="translate(0 211)">
      <path d="M0 22 H34 L45 4 L61 42 L76 22 H108" fill="none" stroke="#43D3A3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="29" fill="#E3E9EF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">diagnose → rewrite → verify</text>
    </g>
  </g>

  <g id="diagnostic-flow" transform="translate(618 48)">
    <path d="M23 68 V244" stroke="#34485C" stroke-width="3"/>
    <path d="M16 236 L23 247 L30 236" fill="none" stroke="#43D3A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="symptom">
      <circle cx="23" cy="42" r="22" fill="#FF7A66"/>
      <text x="23" y="49" text-anchor="middle" fill="#09131F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800">01</text>
      <rect x="65" width="459" height="86" rx="18" fill="url(#panel)" stroke="#2B3D51" stroke-width="2"/>
      <text x="91" y="31" fill="#FF9C8D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">症状 / INPUT</text>
      <text x="91" y="63" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">“写得专业一点，必须绝对准确”</text>
    </g>

    <g id="diagnosis" transform="translate(0 112)">
      <circle cx="23" cy="42" r="22" fill="#F2C96D"/>
      <text x="23" y="49" text-anchor="middle" fill="#09131F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800">02</text>
      <rect x="65" width="459" height="86" rx="18" fill="url(#panel)" stroke="#2B3D51" stroke-width="2"/>
      <text x="91" y="31" fill="#F2C96D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">诊断 / GAP</text>
      <text x="91" y="63" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">标准不可观察 · 承诺无法兑现</text>
    </g>

    <g id="prescription" transform="translate(0 224)">
      <circle cx="23" cy="42" r="22" fill="#43D3A3"/>
      <text x="23" y="49" text-anchor="middle" fill="#09131F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800">03</text>
      <rect x="65" width="459" height="86" rx="18" fill="#122B28" stroke="#2E765F" stroke-width="2"/>
      <text x="91" y="31" fill="#72E2BA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">处方 / OUTPUT</text>
      <text x="91" y="63" fill="#F4F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">证据 · 结构 · 验收 · 能力边界</text>
    </g>
  </g>

  <g id="metadata" transform="translate(58 377)">
    <text fill="#8090A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">CODEX SKILL</text>
    <text x="151" fill="#8090A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">MINIMAL INTERVENTION</text>
    <text x="410" fill="#8090A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">PRIVACY-AWARE</text>
    <text x="1035" fill="#AEEBD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">v1</text>
  </g>
</svg>
